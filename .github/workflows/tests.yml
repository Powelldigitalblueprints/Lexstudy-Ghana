name: LexStudy tests

on:
  push:
    branches:
      - main
      - feature/past-questions-phase-1
  pull_request:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lexstudy_test
          POSTGRES_PASSWORD: lexstudy_test
          POSTGRES_DB: lexstudy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lexstudy_test -d lexstudy_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run SQLite regression suite
        run: python -m unittest discover -s tests -v
      - name: Run PostgreSQL integration suite
        env:
          LEXSTUDY_TEST_BACKEND: postgres
          TEST_DATABASE_URL: postgresql://lexstudy_test:lexstudy_test@localhost:5432/lexstudy_test
        run: python -m unittest discover -s tests -v
