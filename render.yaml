services:
  - type: web
    name: lexstudy-ghana
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DATABASE_URL
        fromDatabase:
          name: lexstudy-ghana-db
          property: connectionString
databases:
  - name: lexstudy-ghana-db
    plan: free
    databaseName: lexstudy_ghana
    user: lexstudy_ghana
