{% extends "base.html" %}
{% block title %}Register — LexStudy Ghana{% endblock %}
{% block content %}
<h1>Create your account</h1>
<p>Accounts save your bookmarks, quiz scores and IRAC practice. All content is currently free to browse.</p>
<form method="post">
  <p><label>Name<br><input name="name" required></label></p>
  <p><label>Email<br><input name="email" type="email" required></label></p>
  <p><label>Password (at least 8 characters)<br><input name="password" type="password" required minlength="8"></label></p>
  <button type="submit">Create account</button>
</form>
<p>Already have an account? <a href="/login">Log in</a>.</p>
{% endblock %}
